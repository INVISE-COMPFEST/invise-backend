services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: "8080"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "backend"
      DB_SSL_MODE: "disable"
      DB_PATH: "public"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin123}"
      MINIO_USE_SSL: "${MINIO_USE_SSL:-false}"
      MINIO_BUCKET: "${MINIO_BUCKET:-backend}"
      MINIO_PUBLIC_URL: "${MINIO_PUBLIC_URL:-https://yourdomain.com/storage}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRY_MINUTES: "60"
      LOG_LEVEL: "info"
      LOG_FORMAT: "json"
      LOG_FILE_PATH: "/app/logs/app.log"
      VALKEY_HOST: "valkey"
      VALKEY_PORT: "6379"
      VALKEY_PASSWORD: "${VALKEY_PASSWORD:-}"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SEEDER_EMAIL: "${SEEDER_EMAIL}"
      SEEDER_PASSWORD: "${SEEDER_PASSWORD}"
    ports:
      - "8080:8080" # Disable this in production, use nginx to reverse proxy the app instead
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "50080:50080" # For dev don't use privileged ports like 80 and 443, use higher ports instead
  #     - "50443:50443" # For dev don't use privileged ports like 80 and 443, use higher ports instead
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:Z,ro
  #     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:Z,ro
  #     - nginx_logs:/var/log/nginx
  #     # - /home/dev/ssl:/etc/nginx/ssl:Z,ro # For production, change with the actual server path to your SSL certificates
  #   depends_on:
  #     app:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   networks:
  #     - app-network
  #   healthcheck:
  #     test: ["CMD", "nginx", "-t"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "backend"
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - postgres_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  minio:
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin123}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  valkey:
    image: valkey/valkey:9
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local
  app_logs:
    driver: local
  # nginx_logs:
  #   driver: local
  static_files:
    driver: local
  minio_data:
    driver: local
  valkey_data:
    driver: local

networks:
  app-network: 
    driver: bridge